<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<title>꼬마 텃밭</title>
</head>
<body>
<main id="game" data-scene="board">
<header><div class="brand"><span>🌿</span> 꼬마 텃밭</div><button id="sound" class="sound" aria-label="소리 끄기" aria-pressed="true">🔊</button></header>
<section class="play" aria-labelledby="title">
<div class="intro"><h1 id="title">도마</h1><p id="hint" role="status">도마 어디든 톡톡 눌러요!</p></div>
<div class="stage" id="stage">
<canvas id="art" width="720" height="430" aria-hidden="true"></canvas>
<div id="targets"></div>
</div>
<div id="tray" class="tray" aria-label="재료와 도구"></div>
</section>
<nav aria-label="놀이 고르기">
<button data-tab="farm"><span>🌱</span>텃밭</button>
<button data-tab="board" aria-current="page"><span>🍴</span>도마</button>
<button data-tab="blend"><span>🥤</span>믹서기</button>
</nav>
</main>
<script src="vendor/three.min.js"></script>
<script src="fruit-3d.js"></script>
<script src="vendor/matter.min.js"></script>
<script type="module" src="game.js"></script>
</body></html>
